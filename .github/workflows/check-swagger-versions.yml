name: Check Swagger Versions

on:
  pull_request:
    paths:
      - 'swagger/**'
      - 'snippets/release-data.mdx'
      - 'developer-support/release-notes/**'
      - 'scripts/check_swagger_versions.py'
      - '.github/workflows/check-swagger-versions.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.9'

      - name: Check swagger info.version against the release notes
        run: python scripts/check_swagger_versions.py . --branch "${{ github.base_ref }}"
