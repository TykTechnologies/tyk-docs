name: Sync Component Versions to tyk-install

on:
  push:
    branches:
      - main
    paths:
      - 'developer-support/release-notes/overview.mdx'
  workflow_dispatch:

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tyk-docs
        uses: actions/checkout@v7

      - name: Checkout tyk-install
        uses: actions/checkout@v7
        with:
          repository: TykTechnologies/tyk-install
          token: ${{ secrets.ORG_GH_TOKEN }}
          path: tyk-install

      - name: Run version updater
        id: updater
        run: |
          mkdir -p tyk-install/scripts
          cp .github/scripts/sync-versions-updater.py tyk-install/scripts/updater.py

          python3 tyk-install/scripts/updater.py | tee updater-output.txt

          rm -rf tyk-install/scripts

          {
            echo 'RESOLVED_VERSIONS<<EOF'
            cat updater-output.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR in tyk-install
        run: |
          cd tyk-install
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-component-versions"

          # Reset the branch to the current main tip on every run so there is
          # never more than one open PR for this sync: a rerun updates the
          # existing branch/PR in place instead of creating a new one.
          EXISTING_PR=$(gh pr list --repo TykTechnologies/tyk-install --head "$BRANCH" --state open --json number --jq '.[0].number')

          git checkout -b "$BRANCH"

          # Stage whatever updater.py actually touched instead of a hardcoded
          # file list, so this step can't drift out of sync with the script.
          git add -A

          if git diff --cached --quiet; then
            echo "No version changes detected - files are already up to date."
            exit 0
          fi

          git commit -m "chore: sync component versions"
          git push origin "$BRANCH" --force

          PR_BODY=$(cat <<'BODY'
          ## Summary

          Auto-generated by the [Sync Component Versions](https://github.com/TykTechnologies/tyk-docs/actions/workflows/sync-versions-to-tyk-install.yml) workflow in tyk-docs.

          Updates the pinned Tyk component versions across the self-managed, hybrid, and AI Studio Docker/Helm assets, resolved directly from the latest Docker Hub tags.

          **Resolved versions:**
          \`\`\`
          ${{ steps.updater.outputs.RESOLVED_VERSIONS }}
          \`\`\`
          BODY
          )

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR #$EXISTING_PR with the latest versions."
            gh pr comment "$EXISTING_PR" --repo TykTechnologies/tyk-install --body "$PR_BODY"
            gh pr edit "$EXISTING_PR" --repo TykTechnologies/tyk-install --add-reviewer MohammedELKheir
          else
            gh pr create \
              --repo TykTechnologies/tyk-install \
              --title "chore: sync component versions" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.ORG_GH_TOKEN }}
