name: Sync Component Versions to tyk-install

on:
  push:
    branches:
      - main
    paths:
      - 'developer-support/release-notes/overview.mdx'
  workflow_dispatch:

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tyk-docs
        uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies
          repositories: tyk-install

      - name: Checkout tyk-install
        uses: actions/checkout@v7
        with:
          repository: TykTechnologies/tyk-install
          token: ${{ steps.app-token.outputs.token }}
          path: tyk-install

      - name: Run version updater
        id: updater
        run: |
          set -o pipefail
          mkdir -p tyk-install/scripts
          cp .github/scripts/sync-versions-updater.py tyk-install/scripts/updater.py

          python3 tyk-install/scripts/updater.py | tee updater-output.txt

          rm -rf tyk-install/scripts

          {
            echo 'RESOLVED_VERSIONS<<EOF'
            cat updater-output.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR in tyk-install
        run: |
          cd tyk-install
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-component-versions"

          # Reset the branch to the current main tip on every run so there is
          # never more than one open PR for this sync: a rerun updates the
          # existing branch/PR in place instead of creating a new one.
          EXISTING_PR=$(gh pr list --repo TykTechnologies/tyk-install --head "$BRANCH" --state open --json number --jq '.[0].number')

          git checkout -b "$BRANCH"

          # Stage whatever updater.py actually touched instead of a hardcoded
          # file list, so this step can't drift out of sync with the script.
          git add -A

          if git diff --cached --quiet; then
            echo "No version changes detected - files are already up to date."
            exit 0
          fi

          git commit -m "chore: sync component versions"
          git push origin "$BRANCH" --force

          PR_BODY=$(cat <<'BODY'
          ## Summary

          Auto-generated by the [Sync Component Versions](https://github.com/TykTechnologies/tyk-docs/actions/workflows/sync-versions-to-tyk-install.yml) workflow in tyk-docs.

          Updates the pinned Tyk component versions across the self-managed, hybrid, and AI Studio Docker/Helm assets, resolved directly from the latest Docker Hub tags.

          **Resolved versions:**
          \`\`\`
          ${{ steps.updater.outputs.RESOLVED_VERSIONS }}
          \`\`\`
          BODY
          )

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR #$EXISTING_PR with the latest versions."
            gh pr comment "$EXISTING_PR" --repo TykTechnologies/tyk-install --body "$PR_BODY"
            # REST, not `gh pr edit --add-reviewer`: that resolves the login over
            # GraphQL, which needs org read access the App token does not have.
            gh api --method POST "repos/TykTechnologies/tyk-install/pulls/$EXISTING_PR/requested_reviewers" \
              -f 'reviewers[]=MohammedELKheir' --silent
          else
            gh pr create \
              --repo TykTechnologies/tyk-install \
              --title "chore: sync component versions" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  sync-oss-quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}

      - name: Checkout tyk-docs
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin OSS Gateway quick start to the LTS version
        run: |
          set -o pipefail
          python3 .github/scripts/sync-oss-quickstart-lts.py | tee "$RUNNER_TEMP/quickstart-output.txt"

      - name: Create or update PR in tyk-docs
        run: |
          QUICK_START="deployment-and-operations/tyk-open-source-api-gateway/quick-start.mdx"
          if git diff --quiet -- "$QUICK_START"; then
            echo "Quick start already pinned to the LTS version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # One fixed branch, force-pushed from main on every run, so there is
          # never more than one open PR for this sync.
          BRANCH="chore/sync-oss-quickstart-lts"
          EXISTING_PR=$(gh pr list --repo TykTechnologies/tyk-docs --head "$BRANCH" --state open --json number --jq '.[0].number')

          git checkout -B "$BRANCH"
          git add "$QUICK_START"
          git commit -m "docs: pin OSS Gateway quick start to the Gateway LTS version"
          git push origin "$BRANCH" --force

          {
            echo "## Summary"
            echo
            echo "Auto-generated by the [Sync Component Versions](https://github.com/TykTechnologies/tyk-docs/actions/workflows/sync-versions-to-tyk-install.yml) workflow."
            echo
            echo "Pins the [OSS Gateway quick start](https://tyk.io/docs/deployment-and-operations/tyk-open-source-api-gateway/quick-start) to the Tyk Gateway \`lts\` version in \`developer-support/release-notes/overview.mdx\`."
            echo
            echo '```'
            cat "$RUNNER_TEMP/quickstart-output.txt"
            echo '```'
            echo
            echo "Backport to the release branches that carry this page, if needed."
          } > "$RUNNER_TEMP/pr-body.md"

          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR #$EXISTING_PR with the latest LTS version."
            gh pr comment "$EXISTING_PR" --repo TykTechnologies/tyk-docs --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create \
              --repo TykTechnologies/tyk-docs \
              --title "docs: pin OSS Gateway quick start to the Gateway LTS version" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --base main \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
