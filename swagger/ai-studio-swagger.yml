          type: string
          description: DocsURL points at the provider's page in the documentation.
        local:
          type: boolean
          description: Local reports an in-process provider (no network call).
        name:
          type: string
        open_detectors:
          type: boolean
        redacts:
          type: boolean
          description: Redacts reports whether ActionRedact is available.
        require_any_connection:
          type: boolean
          description: |-
            RequireAnyConnection demands at least one connection field even though
            none is individually required (Lakera: an API key for the SaaS or an
            endpoint for a self-hosted Guard).
