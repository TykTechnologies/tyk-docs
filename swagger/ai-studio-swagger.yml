      summary: Get a Workspace
      parameters:
      - name: id
        in: path
        description: Workspace ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/api.WorkspaceResponse'
        "402":
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
      security:
      - BearerAuth: []
    delete:
      tags:
      - workspaces
      summary: Delete a Workspace
      description: "Deletes a Workspace and moves every object it owns to the Default\
        \ workspace. Refused (409 default_workspace_locked) for the Default, and (409\
        \ workspace_in_use) while a role is assigned within it. Enterprise Edition."
      parameters:
      - name: id
        in: path
        description: Workspace ID
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: No Content
          content: {}
        "402":
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
      security:
      - BearerAuth: []
    patch:
      tags:
      - workspaces
      summary: Update a Workspace
      description: Renames or re-describes a Workspace. is_default cannot be changed.
        Enterprise Edition.
      parameters:
      - name: id
        in: path
        description: Workspace ID
        required: true
        schema:
          type: integer
      requestBody:
        description: Fields to change
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.WorkspaceInput'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/api.WorkspaceResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
        "402":
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
      security:
      - BearerAuth: []
      x-codegen-request-body-name: workspace
  /workspaces/{id}/objects:
    get:
      tags:
      - workspaces
      summary: Count a Workspace's objects
      description: "Counts the objects a Workspace owns, per resource (llms, apps,\
        \ ...), for the Workspace page. Enterprise Edition."
      parameters:
      - name: id
        in: path
        description: Workspace ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/api.WorkspaceObjectsResponse'
        "402":
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authz.ErrorBody'
      security:
      - BearerAuth: []
