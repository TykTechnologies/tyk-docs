          items:
            $ref: '#/components/schemas/services.DependentRef'
        total:
          type: integer
          description: "Total counts every dependent, including Hidden ones."
    services.PendingChange:
      type: object
      properties:
        at:
          type: string
          description: when that change happened
        change:
          type: string
          description: created | updated | deleted
        hidden:
          type: boolean
          description: |-
            Hidden marks a change whose object the caller cannot see; its type,
            kind, time and Workspace id are still reported.
        id:
          type: integer
          description: |-
            ID and Name are left out (Hidden set) for an object the caller cannot
            see: an App or router in a Workspace their read does not cover.
        name:
          type: string
          description: display name at the time of the query
        type:
          type: string
          description: "llm, app, filter, tool, datasource, plugin, model_router,\
            \ semantic_router, model_price, oauth_client, access_token"
        workspace_id:
          type: integer
          description: |-
            WorkspaceID is the Workspace that owns the object (a stored 0 reads
            as the Default workspace); nil for types with no owning Workspace
            (plugin, model_price, oauth_client, access_token).
        workspace_name:
          type: string
    services.PendingChanges:
      type: object
      properties:
        baseline:
          type: string
          description: push | edge_ack | none
        by_workspace:
          type: array
          description: |-
            ByWorkspace counts every pending change (not only the listed ones)
            by owning Workspace; UnattributedTotal counts those with none.
          items:
            $ref: '#/components/schemas/services.PendingWorkspaceTotal'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/services.PendingChange'
        last_push_at:
          type: string
        namespace:
          type: string
          description: Namespace is the canonical spelling (models.CanonicalNamespace).
        outside_total:
          type: integer
        since:
          type: string
          description: |-
            Since is the reference point: the namespace's last push, or -- when
            no push was ever recorded but an edge is in sync with the namespace
            checksum -- that edge's ack. Nil when there is neither, in which case
            every object is "created". Baseline says which.
        stained:
          type: boolean
        total:
          type: integer
        unattributed_total:
          type: integer
        workspace_id:
          type: integer
          description: |-
            Set when asked about one Workspace (?workspace_id=): OutsideTotal
            counts the changes foreign to it (PendingChangeIsForeign) and Stained
            reports whether there are any, i.e. whether a push limited to that
            Workspace would carry changes from outside it.
    services.PendingWorkspaceTotal:
      type: object
      properties:
        name:
          type: string
        total:
          type: integer
