    api.LLMInput:
      type: object
      properties:
        data:
          type: object
          properties:
            attributes:
              type: object
              properties:
                active:
                  type: boolean
                allow_internal_host:
                  type: boolean
                  description: |-
                    AllowInternalHost is the admin-only "Allow internal host"
                    switch (its endpoint may be an internal address). Absent keeps
                    the stored value; a change by a non-admin is refused (403).
                allowed_models:
                  type: array
                  items:
                    type: string
                api_endpoint:
                  type: string
                api_key:
                  type: string
                budget_start_date:
                  type: string
                default_model:
                  type: string
                dont_log_bodies:
                  type: boolean
                failover:
                  type: object
                  description: |-
                    Failover waterfall. On PATCH an absent key keeps the stored
                    value and an explicit null clears it.
                  allOf:
                  - $ref: '#/components/schemas/models.LLMFailover'
                filters:
                  type: array
                  items:
                    type: integer
                governed_metadata:
                  type: object
                  additionalProperties: true
                  description: "Governed metadata (Enterprise). nil = untouched; {}\
                    \ = clear."
                logo_url:
                  type: string
                long_description:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                monthly_budget:
                  type: number
                name:
                  type: string
                namespace:
                  type: string
                price_multipliers:
                  type: object
                  description: |-
                    PriceMultipliers overrides the vendor's price multiplier per
                    service tier ({"batch": 0.4}). On PATCH an absent key keeps the
                    stored value and null or {} removes the overrides.
                  allOf:
                  - $ref: '#/components/schemas/models.LLMPriceMultipliers'
                privacy_score:
                  type: integer
                short_description:
                  type: string
                tracing_content_mode_max:
                  type: string
                  description: |-
                    TracingContentModeMax caps the agent tracing content mode for
                    this LLM (Enterprise); "" is no cap. On PATCH an absent key
                    keeps the stored value.
                tracing_propagation_opt_out:
                  type: boolean
                  description: |-
                    TracingPropagationOptOut stops traceparent reaching this LLM's
                    upstream (default false: it is sent).
                vendor:
                  type: string
                vendor_workspace_id:
                  type: string
                  description: |-
                    VendorWorkspaceID pins the vendor workspace (Anthropic:
                    anthropic-workspace-id). On PATCH an absent key keeps the stored
                    value and "" removes the pin.
            type:
              type: string
      description: LLM input model
