    api.AppDetailResponse:
      type: object
      properties:
        attributes:
          type: object
          properties:
            budget_source:
              type: string
              description: |-
                BudgetSource tells the portal where the budget came from: "team"
                when the App's team hands out budgets from a pool, else empty.
            budget_start_date:
              type: string
            credential:
              $ref: '#/components/schemas/api.CredentialDetail'
            credential_id:
              type: integer
            datasource_ids:
              type: array
              items:
                type: integer
            description:
              type: string
            is_active:
              type: boolean
            is_orphaned:
              type: boolean
            llm_ids:
              type: array
              items:
                type: integer
            mcp_server_ids:
              type: array
              description: |-
                MCPServerIDs / MCPServers mirror the list endpoint (serializeApp):
                the portal app page mounts its "MCP access" section from them.
              items:
                type: integer
            mcp_servers:
              type: array
              items:
                $ref: '#/components/schemas/api.AppMCPServerOutput'
            model_router_ids:
              type: array
              description: |-
                Model Routers the app is granted (Enterprise); the portal app page
                shows their unified-ingress model strings.
              items:
                type: integer
            model_routers:
              type: array
              items:
                $ref: '#/components/schemas/api.AppModelRouterOutput'
            monthly_budget:
              type: number
            name:
              type: string
            semantic_router_ids:
              type: array
              description: Semantic Routers the app is granted (Enterprise).
              items:
                type: integer
            semantic_routers:
              type: array
              items:
                $ref: '#/components/schemas/api.AppSemanticRouterOutput'
            team_id:
              type: integer
            tool_ids:
              type: array
              items:
                type: integer
            user_id:
              type: integer
        id:
          type: string
        type:
          type: string
      description: App detail response model
    api.AppGuardrailCapabilityInput:
      type: object
      properties:
        value:
          type: string
          description: "Value is read_only, read_tools or acting; \"\" clears the\
            \ attestation."
    api.AppGuardrailCapabilityResponse:
      type: object
      properties:
        effective:
          type: string
          description: Effective is the capability the guardrail floors apply (""
            is acting).
        guardrails_apply:
          type: boolean
          description: |-
            GuardrailsApply is true when a guardrail filter is attached to one of
            the App's LLMs: only then does a resource change by someone who is not
            a full administrator clear the attestation visibly.
        reasons:
          type: array
          items:
            type: string
        reset_at:
          type: string
        reset_by:
          type: integer
          description: |-
            ResetBy and ResetAt record the last visible reset of the attestation
            after a resource change (ResetBy null when no user is known, such as a
            plugin); both null once the capability is attested again.
        suggestion:
          type: string
        value:
          type: string
          description: |-
            Value is the attested capability: read_only, read_tools, acting, or ""
            when nobody has attested one (treated as acting).
    api.AppInput:
      type: object
      properties:
        data:
          type: object
          properties:
            attributes:
              type: object
              properties:
                budget_start_date:
                  type: string
                datasource_ids:
                  type: array
                  items:
                    type: integer
                description:
                  type: string
                is_active:
                  type: boolean
                  description: |-
                    IsActive is the live switch. Omitted = unchanged on update, live
                    on create (unless the caller lacks apps:publish, in which case
                    the app is created inactive). Setting it needs apps:publish.
                llm_ids:
                  type: array
                  items:
                    type: integer
                mcp_server_ids:
                  type: array
                  description: |-
                    MCPServerIDs binds Tyk-managed MCP servers (Enterprise). Omitted
                    leaves the bindings unchanged on update; an empty list clears them.
                  items:
                    type: integer
                metadata:
                  type: object
                  additionalProperties: true
                model_router_ids:
                  type: array
                  description: |-
                    ModelRouterIDs grants Model Routers (Enterprise). Omitted leaves
                    the grants unchanged on update; an empty list clears them.
                  items:
                    type: integer
                monthly_budget:
                  type: number
                name:
                  type: string
                namespace:
                  type: string
                plugin_resources:
                  type: array
                  items:
                    $ref: '#/components/schemas/api.PluginResourceInput'
                semantic_router_ids:
                  type: array
                  description: |-
                    SemanticRouterIDs grants Semantic Routers (Enterprise), with
                    the same omitted/empty rules.
                  items:
                    type: integer
                team_id:
                  type: integer
                  description: |-
                    TeamID attributes the App to a team (Enterprise team budgets).
                    Omitted = the owner's budget team on create, unchanged on update.
                tool_ids:
                  type: array
                  items:
                    type: integer
                tracing:
                  type: object
                  description: |-
                    Tracing overrides the global agent tracing settings for the
                    App (Enterprise). Omitted keeps the stored settings on update;
                    changing any of them needs traces:write. owner_may_view_content
                    must be false until the Portal trace views ship (400 if true).
                  allOf:
                  - $ref: '#/components/schemas/models.AppTracingSettings'
                user_id:
                  type: integer
            type:
              type: string
      description: App input model
    api.AppListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/api.AppResponse'
        meta:
          type: object
          properties:
            page_number:
              type: integer
            page_size:
              type: integer
            total_count:
              type: integer
            total_pages:
              type: integer
      description: App list response model
