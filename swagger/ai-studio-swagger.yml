    authz.Action:
      type: string
      enum:
      - read
      - write
      - delete
      - execute
      - publish
      x-enum-varnames:
      - ActionRead
      - ActionWrite
      - ActionDelete
      - ActionExecute
      - ActionPublish
    authz.Error:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        permission:
          type: string
        title:
          type: string
    authz.ErrorBody:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/authz.Error'
    authz.Resource:
      type: object
      properties:
        actions:
          type: array
          description: "Actions lists the actions this resource offers, in display\
            \ order."
          items:
            $ref: '#/components/schemas/authz.Action'
        description:
          type: string
          description: Description is optional help text for the role editor.
        dynamic:
          type: boolean
          description: |-
            Dynamic marks a resource registered at runtime (plugins) rather than
            in init(); dynamic resources can be replaced and unregistered.
        group:
          type: string
          description: Group is the navigation group the resource belongs to; see
            Groups.
        key:
          type: string
          description: |-
            Key is the permission resource slug: plural, kebab-case, matching the
            route collection segment ("llms", "data-catalogues").
        label:
          type: string
          description: "Label is the human name, matching the admin navigation where\
            \ one exists."
        plugin:
          type: string
          description: |-
            Plugin is the permission key of the plugin that contributed this
            resource ("plugin:<manifest id>"), or "" for built-in resources. The
            role editor groups plugin resources under their plugin.
        plugin_label:
          type: string
          description: PluginLabel is the display name of the contributing plugin.
        privileged:
          type: boolean
          description: |-
            Privileged marks resources whose write/delete can escalate access
            (users, groups, roles, identity providers, plugins). The UI warns.
        scope:
          type: object
          description: |-
            Scope says whether the resource's objects belong to a Workspace and how
            Workspace-scoped bindings apply to it; see ScopeKind. Plugin resources
            are always global.
          allOf:
          - $ref: '#/components/schemas/authz.ScopeKind'
        scope_parent:
          type: string
          description: |-
            ScopeParent is, for ScopeWorkspaceParent, the key of the resource whose
            objects own this one's ("apps" for credentials). Empty otherwise.
        sensitive:
          type: boolean
          description: |-
            Sensitive marks a data class (transcripts, logs, secrets) that is split
            out so read can be withheld independently. The UI shows a shield.
    authz.ScopeKind:
      type: string
      enum:
      - ""
      - workspace_write
      - workspace_full
      - workspace_parent
      x-enum-varnames:
      - ScopeGlobal
      - ScopeWorkspaceWrite
      - ScopeWorkspaceFull
      - ScopeWorkspaceParent
