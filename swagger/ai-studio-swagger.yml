      type: object
      properties:
        expires_after_days:
          type: integer
        name:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/templates.Part'
        placement:
          $ref: '#/components/schemas/templates.Placement'
    api.AppPromptTemplateResponse:
      type: object
      properties:
        app_id:
          type: integer
        approved_at:
          type: string
        approved_by:
          type: integer
        content_hash:
          type: string
          description: |-
            ContentHash identifies this version's reviewed content (name,
            version, placement, parts, expiry). Approving takes it back.
        created_at:
          type: string
        created_by:
          type: integer
        expires_after_days:
          type: integer
        id:
          type: integer
        last_matched_at:
          type: string
        name:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/templates.Part'
        placement:
          $ref: '#/components/schemas/templates.Placement'
        ref:
          type: string
        status:
          type: string
        updated_at:
          type: string
        version:
          type: integer
    api.AppResponse:
      type: object
      properties:
        attributes:
          type: object
          properties:
            budget_start_date:
              type: string
            credential_active:
              type: boolean
              description: |-
                CredentialActive is the state of the app's credential, null when the
                app has none, so the apps list can show it without a credentials fetch.
            credential_id:
              type: integer
            datasource_ids:
              type: array
              items:
                type: integer
            description:
              type: string
            guardrail_capability:
              type: string
              description: |-
                GuardrailCapability is the attested capability ("" = unattested,
                treated as acting); set with PUT /apps/{id}/guardrail-capability.
            guardrail_capability_reset:
              type: boolean
              description: |-
                GuardrailCapabilityReset is true on the response to a change that
                cleared the attested capability (a resource change by someone who
                is not a full administrator, on an App whose LLMs run guardrails).
            is_active:
              type: boolean
              description: live switch (apps:publish)
            is_orphaned:
              type: boolean
            llm_ids:
              type: array
              items:
                type: integer
            mcp_server_ids:
              type: array
              description: Tyk-managed MCP servers bound to the app (Enterprise).
              items:
                type: integer
            mcp_servers:
              type: array
              items:
                $ref: '#/components/schemas/api.AppMCPServerOutput'
            metadata:
              type: object
              additionalProperties: true
            model_router_ids:
              type: array
              description: Model Routers the app is granted (Enterprise).
              items:
                type: integer
            model_routers:
              type: array
              items:
                $ref: '#/components/schemas/api.AppModelRouterOutput'
            monthly_budget:
              type: number
            name:
              type: string
            namespace:
              type: string
            plugin_resources:
              type: array
              items:
                $ref: '#/components/schemas/api.PluginResourceOutput'
            semantic_router_ids:
              type: array
              description: Semantic Routers the app is granted (Enterprise).
              items:
                type: integer
            semantic_routers:
              type: array
              items:
                $ref: '#/components/schemas/api.AppSemanticRouterOutput'
            team_id:
              type: integer
            tool_ids:
              type: array
              items:
                type: integer
            tracing:
              type: object
              description: Agent tracing overrides (Enterprise).
              allOf:
              - $ref: '#/components/schemas/models.AppTracingSettings'
            user_id:
              type: integer
            workspace_id:
              type: integer
              description: |-
                WorkspaceID is the Workspace that owns the App (Enterprise
                Workspaces); a stored 0 reads as the Default.
        id:
          type: string
        type:
          type: string
      description: App response model
    api.AppSemanticRouterOutput:
      type: object
      properties:
        id:
          type: integer
        models:
          type: array
          items:
            type: string
        name:
          type: string
        slug:
          type: string
    api.AppUsageSummary:
      type: object
      properties:
        app_id:
          type: string
        budget_start_date:
          type: string
          description: |-
            BudgetStartDate is the start of the current budget period, which
            CurrentSpend covers.
        currency:
          type: string
          description: |-
            Currency is the currency of CurrentSpend: a budget's currency is
            implied by its spend. When the period mixes currencies,
            MixedCurrencySpend has the spend by currency instead, CurrentSpend is
            0, and the budget refuses requests (costs are not converted).
        current_spend:
          type: number
        last_access_at:
          type: string
        mixed_currency_spend:
          type: object
          additionalProperties:
            type: number
        monthly_budget:
          type: number
        percentage:
          type: number
        requests_30d:
          type: integer
    api.AppUsageSummaryResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/api.AppUsageSummary'
        spend_tracked:
          type: boolean
          description: |-
            SpendTracked is false in Community Edition, where spending is not
            recorded and current_spend is always zero.
    api.AppWithTools:
      type: object
      properties:
        description:
          type: string
        id:
          type: integer
        name:
          type: string
        tools:
          type: array
          items:
            type: string
    api.ApprovalRequest:
      required:
      - approved
      type: object
      properties:
        approved:
          type: boolean
    api.BackfillModelPriceInput:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
    api.BackfillModelPriceResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            model_price:
              $ref: '#/components/schemas/api.ModelPriceResponse'
            rows_priced:
              type: integer
              description: RowsPriced is the number of chat records that were priced.
    api.BrandingSettingsAttributes:
      type: object
      properties:
        app_title:
          type: string
        background_color:
          type: string
        custom_css:
          type: string
        has_custom_favicon:
          type: boolean
        has_custom_logo:
          type: boolean
        primary_color:
          type: string
        secondary_color:
          type: string
    api.BrandingSettingsResponse:
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/api.BrandingSettingsAttributes'
        id:
          type: string
        type:
          type: string
    api.BulkActionInput:
      type: object
      properties:
        action:
          type: string
          example: deactivate
        ids:
          type: array
          items:
            type: integer
      description: Bulk action request
    api.BulkActionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            action:
              type: string
            failed:
              type: integer
            results:
              type: array
              items:
                $ref: '#/components/schemas/api.BulkActionResult'
            succeeded:
              type: integer
      description: Bulk action response
    api.BulkActionResult:
      type: object
      properties:
        error:
          type: string
        id:
          type: integer
        ok:
          type: boolean
      description: One object's outcome in a bulk action
    api.CMessageListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/api.CMessageResponse'
    api.CMessageResponse:
      type: object
      properties:
        attributes:
          type: object
          properties:
            chat_id:
              type: integer
            content:
              type: object
            created_at:
              type: string
            session:
              type: string
        id:
          type: string
        type:
          type: string
      description: CMessage response model
    api.CallOperationInput:
      type: object
      properties:
        data:
