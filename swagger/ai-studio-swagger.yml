openapi: 3.0.1
info:
  title: Midsommar API
  description: This is the API for the Midsommar user and group management system.
  termsOfService: http://swagger.io/terms/
  contact:
    name: API Support
    url: http://www.swagger.io/support
    email: support@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: "1.0"
servers:
- url: //localhost:8080/api/v1
paths:
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - oauth
      summary: OAuth Authorization Server Metadata
      description: Provides metadata about the OAuth authorization server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.OAuthServerMetadata'
  /agent-tracing/config:
    get:
      tags:
      - agent-tracing
      summary: Agent tracing settings
      description: "The effective content and retention settings (from AGENT_TRACING_*\
        \ environment variables; Apps, LLMs, tools and datasources override them).\
        \ content_ceiling bounds every App, default and request header; content_default_mode\
        \ applies to Apps without their own mode. Never includes keys."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      security:
      - BearerAuth: []
  /agent-tracing/purge:
    post:
      tags:
      - agent-tracing
      summary: Purge an end user's agent sessions
      description: "Deletes every session whose declared end user is end_user (right\
        \ to erasure). Audited by session ids, never by the end user itself."
      requestBody:
        description: What to erase
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.PurgeBody'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      security:
      - BearerAuth: []
      x-codegen-request-body-name: body
  /agent-tracing/sessions:
    get:
      tags:
      - agent-tracing
      summary: List agent sessions (Enterprise)
      description: "Sessions in a time range (default the last 24 h), newest first,\
        \ with the spec §6.1 filters and cursor pagination. end_user and external_id\
        \ are refused here: use POST /agent-tracing/sessions/query so they stay out\
        \ of URLs."
      parameters:
      - name: from
        in: query
        description: RFC 3339 start (default 24 h before to)
        schema:
          type: string
      - name: to
        in: query
        description: RFC 3339 end (default now)
        schema:
          type: string
      - name: app_id
        in: query
        description: App
        schema:
          type: integer
      - name: user_id
        in: query
        description: Studio user
        schema:
          type: integer
      - name: session_id
        in: query
        description: Exact session id
        schema:
          type: string
      - name: agent
        in: query
        description: Agent name
        schema:
          type: string
      - name: model
        in: query
        description: Model
        schema:
          type: string
      - name: tool
        in: query
        description: Tool called
        schema:
          type: string
      - name: status
        in: query
        description: "active, closed or error"
        schema:
          type: string
      - name: source
        in: query
        description: declared or inferred
        schema:
          type: string
      - name: weak_links
        in: query
        description: Only sessions with weak links
        schema:
          type: boolean
      - name: has_errors
        in: query
        description: Has errors
        schema:
          type: boolean
      - name: has_gateway_events
        in: query
        description: Has gateway events
        schema:
          type: boolean
      - name: cost_min_micros
        in: query
        description: Minimum cost (micros)
        schema:
          type: integer
      - name: cost_max_micros
        in: query
        description: Maximum cost (micros)
        schema:
          type: integer
      - name: duration_min_ms
        in: query
        description: Minimum duration (ms)
        schema:
          type: integer
      - name: duration_max_ms
        in: query
        description: Maximum duration (ms)
        schema:
          type: integer
      - name: sort
        in: query
        description: "started_at, cost, duration, tokens, turns, llm_calls, tool_calls\
          \ or errors; prefix - for descending (default -started_at)"
        schema:
          type: string
      - name: cursor
        in: query
        description: next_cursor of the previous page
        schema:
          type: string
      - name: limit
        in: query
        description: "Page size (1-200, default 50)"
        schema:
          type: integer
      responses:
        "200":
          description: "{data: [session], next_cursor}"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "402":
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
  /agent-tracing/sessions/{session_id}:
    get:
      tags:
      - agent-tracing
      summary: Get an agent session (Enterprise)
      description: "The session with its agents and turns, and what the caller may\
        \ do with it (viewer)."
      parameters:
      - name: session_id
        in: path
        description: Session id (UUID)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "{session, agents, traces, viewer}"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
    delete:
      tags:
      - agent-tracing
      summary: Purge an agent session
      description: "Deletes a session and everything captured for it: spans, links,\
        \ payloads, correlation keys, agents and, for a declared session, its staged\
        \ events (right to erasure). An inferred session's events still waiting to\
        \ be assembled carry no session id and are not deleted: the event that completes\
        \ the session may re-create it. To erase a data subject completely, use POST\
        \ /agent-tracing/purge with their end_user, which also deletes their staged\
        \ events. Audited; refused (503) when the audit trail cannot record it."
      parameters:
      - name: session_id
        in: path
        description: Session id (UUID)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      security:
      - BearerAuth: []
  /agent-tracing/sessions/{session_id}/export:
    get:
      tags:
      - agent-tracing
      summary: Export an agent session
      description: JSON (application/vnd.tyk.agent-trace+json; v=1) or a Markdown
        transcript of one session. content=true includes captured content when the
        caller holds trace-content read; otherwise the export is content-stripped
        (X-Tyk-Export-Content says which). Every export is audited; it is refused
        (503) when the audit trail cannot record it.
      parameters:
      - name: session_id
        in: path
        description: Session id (UUID)
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: json (default) or markdown
        schema:
          type: string
      - name: content
        in: query
        description: Include captured content
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      security:
      - BearerAuth: []
  /agent-tracing/sessions/{session_id}/search:
    post:
      tags:
      - agent-tracing
      summary: Find in a session (Enterprise)
      description: "Matches span names, tool names, models, operations and error types.\
        \ The term is in the body so it never reaches a URL."
      parameters:
      - name: session_id
        in: path
        description: Session id (UUID)
        required: true
        schema:
          type: string
      requestBody:
        description: Find term (1-256 characters)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.SessionSearchBody'
        required: true
      responses:
        "200":
          description: "{matches: [{span_id, field, snippet}], total, truncated}"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      x-codegen-request-body-name: query
  /agent-tracing/sessions/{session_id}/spans:
    get:
      tags:
      - agent-tracing
      summary: List a session's spans (Enterprise)
      description: "The span skeleton (no content), keyset-paged by (start_time, span_id)."
      parameters:
      - name: session_id
        in: path
        description: Session id (UUID)
        required: true
        schema:
          type: string
      - name: kind
        in: query
        description: Span kind
        schema:
          type: string
      - name: status
        in: query
        description: Span status
        schema:
          type: string
      - name: agent_id
        in: query
        description: Agent id
        schema:
          type: string
      - name: from
        in: query
        description: RFC 3339
        schema:
          type: string
      - name: to
        in: query
        description: RFC 3339
        schema:
          type: string
      - name: include
        in: query
        description: "previews: ask for inline content previews"
        schema:
          type: string
      - name: cursor
        in: query
        description: next_cursor of the previous page
        schema:
          type: string
      - name: limit
        in: query
        description: "Page size (1-1000, default 1000)"
        schema:
          type: integer
      responses:
        "200":
          description: "{data: [span], next_cursor, previews}"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
  /agent-tracing/sessions/query:
    post:
      tags:
      - agent-tracing
      summary: Query agent sessions (Enterprise)
      description: "The sessions list with every filter in the body, including end_user\
        \ and external_id."
      requestBody:
        description: Filters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.SessionQueryBody'
        required: true
      responses:
        "200":
          description: "{data: [session], next_cursor}"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "402":
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      x-codegen-request-body-name: query
  /agent-tracing/spans/{span_id}:
    get:
      tags:
      - agent-tracing
      summary: Get an agent span (Enterprise)
      description: One span with all its links (candidates included) and gateway events.
        No content.
      parameters:
      - name: span_id
        in: path
        description: Span id (16 lowercase hex)
        required: true
        schema:
          type: string
      - name: app_id
        in: query
        description: App the span belongs to (ids are unique per App)
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: "{span, events, session_id}"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
  /agent-tracing/spans/{span_id}/payloads/{part}:
    get:
      tags:
      - agent-tracing
      summary: Read a captured payload part
      description: "One captured part of a span (request, response, system_instructions,\
        \ tool_definitions, tool_args, tool_result, error_body), as stored after the\
        \ content pipeline. Needs trace-content read; every read is audited, and the\
        \ content is refused (503) when the audit trail cannot record it. Content\
        \ over max_bytes (and the UI view cap) comes back truncated."
      parameters:
      - name: span_id
        in: path
        description: Span id (16 lowercase hex)
        required: true
        schema:
          type: string
      - name: part
        in: path
        description: Payload part
        required: true
        schema:
          type: string
      - name: app_id
        in: query
        description: The span's App (span ids are unique only within an App)
        required: true
        schema:
          type: integer
      - name: max_bytes
        in: query
        description: Cap on the returned content
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      security:
      - BearerAuth: []
  /agent-tracing/traces/{trace_id}:
    get:
      tags:
      - agent-tracing
      summary: Get an agent trace (Enterprise)
      description: One turn with its first page of spans (keyset-paged like the session
        spans).
      parameters:
      - name: trace_id
        in: path
        description: Trace id (32 lowercase hex)
        required: true
        schema:
          type: string
      - name: app_id
        in: query
        description: App the trace belongs to (ids are unique per App)
        required: true
        schema:
          type: integer
      - name: cursor
        in: query
        description: next_cursor of the previous page
        schema:
          type: string
      - name: limit
        in: query
        description: "Page size (1-1000, default 1000)"
        schema:
          type: integer
      responses:
        "200":
          description: "{trace, session_id, spans, next_cursor}"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
  /agent-tracing/traces/{trace_id}/export:
    get:
      tags:
      - agent-tracing
      summary: Export an agent trace (turn)
      description: "As the session export, for one trace of one App."
      parameters:
      - name: trace_id
        in: path
        description: Trace id (32 lowercase hex)
        required: true
        schema:
          type: string
      - name: app_id
        in: query
        description: The trace's App
        required: true
        schema:
          type: integer
      - name: format
        in: query
        description: json (default) or markdown
        schema:
          type: string
      - name: content
        in: query
        description: Include captured content
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
      security:
      - BearerAuth: []
  /analytics/app-interactions-over-time:
    get:
      tags:
      - Analytics
      summary: Get app interactions over time
      description: Get the number of LLM interactions for a specific app over time
      parameters:
      - name: start_date
        in: query
        description: Start date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: app_id
        in: query
        description: App ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analytics.ChartData'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
  /analytics/apps-for-model:
    get:
      tags:
      - Analytics
      summary: Get the apps that used a model
      description: "List every app that called the given model through the given LLM\
        \ entry in the period, with request counts, cost and first/last use. Most\
        \ recently used first."
      parameters:
      - name: start_date
        in: query
        description: Start date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: llm_id
        in: query
        description: LLM ID
        required: true
        schema:
          type: integer
      - name: model_name
        in: query
        description: Model name as recorded in usage records
        required: true
        schema:
          type: string
      - name: interaction_type
        in: query
        description: Interaction type to filter by (chat/proxy)
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/analytics.ModelAppUsage'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
  /analytics/budget-usage:
    get:
      tags:
      - Analytics
      summary: Get current monthly budget usage for apps and LLMs
      description: "Returns usage of monthly budgets for apps and LLMs, with optional\
        \ date range for total cost"
      parameters:
      - name: start_date
        in: query
        description: Start date (YYYY-MM-DD) for total cost calculation
        schema:
          type: string
      - name: end_date
        in: query
        description: End date (YYYY-MM-DD) for total cost calculation
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.BudgetUsage'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
  /analytics/budget-usage-for-app:
    get:
      tags:
      - Analytics
      summary: Get budget usage for a specific app
      description: Get the current budget usage for a specific app
      parameters:
      - name: app_id
        in: query
        description: App ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AppBudgetUsageResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
  /analytics/chat-interactions-for-chat:
    get:
      tags:
      - Analytics
      summary: Get chat interactions for a specific chat
      description: Get the number of interactions for a specific chat over time
      parameters:
      - name: start_date
        in: query
        description: Start date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: chat_id
        in: query
        description: Chat ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analytics.ChartData'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
  /analytics/chat-records-per-day:
    get:
      tags:
      - Analytics
      summary: Get chat records per day
      description: Get the total number of chat records per day for a given time period
      parameters:
      - name: start_date
        in: query
        description: Start date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analytics.ChartData'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
  /analytics/chat-records-per-user:
    get:
      tags:
      - Analytics
      summary: Get chat records per user
      description: Get the total number of chat records per user for a given time
        period
      parameters:
      - name: start_date
        in: query
        description: Start date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: End date (YYYY-MM-DD)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analytics.ChartData'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorResponse'
  /analytics/cost-analysis:
    get:
      tags:
      - Analytics
      summary: Get cost analysis
