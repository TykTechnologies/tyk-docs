        slug:
          type: string
    api.AppPromptTemplateApproveInput:
      type: object
      properties:
        content_hash:
          type: string
          description: |-
            ContentHash is the content_hash of the version the administrator
            reviewed, as the API returned it with the parts shown. Required.
