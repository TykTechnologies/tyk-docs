    semanticrouting.Route:
      type: object
      properties:
        description:
          type: string
          description: |-
            Description says what belongs on this route. The judge reads it, and
            the portal shows it.
        keywords:
          type: array
          description: Keywords decide the route outright when one matches.
          items:
            $ref: '#/components/schemas/semanticrouting.Keyword'
        name:
          type: string
          description: |-
            Name is the route's identifier ("complex", "code"): what the judge
            answers with and what "{router}/{route}" names.
        priority:
          type: integer
          description: Priority breaks ties between routes (higher first).
        target:
          $ref: '#/components/schemas/semanticrouting.Target'
        threshold:
          type: number
          description: |-
            Threshold is the similarity (0..1] the best example must reach for the
            route to be picked by the embedding stage. 0 means DefaultThreshold.
        utterances:
          type: array
          description: |-
            Utterances are example requests. The input is compared with each and
            the route scores its best match (cosine similarity).
          items:
            type: string
