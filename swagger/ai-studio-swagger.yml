          type: string
          description: Actor
        method:
          type: string
        req_id:
          type: string
        request_dump:
          type: string
          description: Populated only when detailed recording is enabled.
        resource_id:
          type: string
        resource_name:
          type: string
        resource_type:
          type: string
          description: What it touched
        response_dump:
          type: string
        route:
          type: string
        status:
          type: integer
