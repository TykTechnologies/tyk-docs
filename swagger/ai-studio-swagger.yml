      type: object
      properties:
        content_mode:
          type: string
          description: ContentMode is the App's capture mode (off|metadata|hashed|redacted|full).
        enabled:
          type: boolean
          description: Enabled turns tracing on or off for the App; nil inherits.
        max_request_override:
          type: string
          description: |-
            MaxRequestOverride is the highest mode a request header may raise
            capture to for this App.
        owner_may_view_content:
          type: boolean
          description: |-
            OwnerMayViewContent will let the App's Portal owner read captured
            content (Q4) once the Portal trace views exist (jyx.42). Until then it
            is always false: Validate refuses true and Scan reads a stored true as
            false (jyx.175). Hub-only: never synced to edges.
        payload_days:
          type: integer
          description: PayloadDays is how long captured content is kept; nil inherits.
        session_idle_timeout:
          type: string
          description: |-
            SessionIdleTimeout closes a session after this long without activity
            (a Go duration, e.g. "2h").
