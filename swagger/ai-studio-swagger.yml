          type: integer
        user_name:
          type: string
    models.BudgetUsage:
      type: object
      properties:
        budget:
          type: number
        budget_start_date:
          type: string
        currency:
          type: string
          description: |-
            Currency is the currency of Spent: the one currency of the period's
            spend (a budget's currency is implied by its spend). Empty when there
            is no spend, or when the period mixes currencies.
        entity_id:
          type: integer
        entity_type:
          type: string
          description: '"LLM" or "App"'
        mixed_currency_spend:
          type: object
          additionalProperties:
            type: number
          description: |-
            MixedCurrencySpend is set when the period mixes currencies: the spend
            by currency. Costs are not converted, so Spent and Usage are 0 and the
            budget refuses requests.
        name:
          type: string
        period_end:
          type: string
        period_start:
          type: string
          description: |-
            PeriodStart and PeriodEnd are the current budget period Spent covers,
            as enforcement computes it (budget.Period): PeriodEnd is the start of
            the next period (exclusive).
        spent:
          type: number
        total_cost:
          type: number
          description: cost for the specified date range
        total_tokens:
          type: integer
          description: total tokens for the specified date range
        usage:
          type: number
          description: percentage
        user_email:
          type: string
          description: Email of the user who owns the app (pointer to handle null
            case)
        user_id:
          type: integer
          description: ID of the user who owns the app
