              type: object
              properties:
                grant_type:
                  type: string
                  description: Must be 'authorization_code'
                code:
                  type: string
                  description: Authorization code
                redirect_uri:
                  type: string
                  description: Redirect URI used in authorization request
                client_id:
                  type: string
                  description: Client ID
                client_secret:
                  type: string
                  description: Client Secret (for confidential clients using client_secret_post)
                code_verifier:
                  type: string
                  description: PKCE Code Verifier
        required: true
      responses:
        "200":
          description: OK
          content:
